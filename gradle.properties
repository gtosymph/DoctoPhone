org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Base majeure/mineure du nom de version. L'action GitHub y ajoute le numéro de run
# (`appVersionBase.<github.run_number>`) pour obtenir un versionName qui croît à chaque
# publication sans jamais redescendre. Voir app/build.gradle.kts et .github/workflows/release.yml.
appVersionBase=0.2
