org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Base majeure/mineure du nom de version. L'action GitHub compose
# `appVersionBase.<versionCode>` pour que le nom montré à l'utilisateur porte toujours le
# numéro qui décide de la mise à jour. Voir .github/workflows/release.yml.
appVersionBase=0.2

# Décalage ajouté au numéro de run GitHub pour obtenir le versionCode.
#
# Il existe pour une raison précise, apprise à la première publication. Le compteur de runs
# repart de 1, alors que les APK construits à la main avant l'existence de cette action
# portaient déjà `versionCode = 1`. La première release publiée annonçait donc la même
# version que l'app déjà installée : Android n'y voyait pas une mise à jour, et le
# vérificateur de l'app concluait « à jour » puisqu'il exige un numéro strictement
# supérieur.
#
# Le décalage place toute publication automatique au-dessus de tout ce qui a pu être
# installé à la main. Ne le diminuez jamais : un versionCode qui redescend rend la mise à
# jour impossible à installer, définitivement, sans désinstaller l'app.
appVersionCodeOffset=100
